<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8e1219">
<title>Világ proletárjai, kattintsatok!</title>
<meta name="description" content="Humoros, rombolós böngészőjáték szovjet propagandaplakát-stílusban. Workers of the world, click!">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23c8202a'/%3E%3Cpath d='M32 6l7.6 16.4 17.9 2-13.3 12.2 3.7 17.6L32 45.3 16.1 54.2l3.7-17.6L6.5 24.4l17.9-2z' fill='%23f2c230'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="top">
      <div class="lvl"><span id="hLevelNo"></span><b id="hLevelName"></b></div>
      <div class="stats">
        <div class="stat"><small data-i="score"></small><b id="hScore">0</b></div>
        <div class="stat"><small data-i="shots"></small><b id="hShots">0</b></div>
        <div class="stat"><small data-i="targets"></small><b id="hTargets">0</b></div>
      </div>
      <div class="tbtns">
        <button id="bMute" class="ibtn" aria-label="mute"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path id="muteX" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.4" fill="none"/><path id="muteW" d="M16 8c2 2 2 6 0 8M18.5 5.5c3.5 3.5 3.5 9.5 0 13" stroke="currentColor" stroke-width="2.2" fill="none"/></svg></button>
        <button id="bRestart" class="ibtn" aria-label="restart"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8h-3a5 5 0 1 1-5-5v3l5-4.5L12 1z" fill="currentColor"/></svg></button>
        <button id="bPause" class="ibtn" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" fill="currentColor"/><rect x="14" y="4" width="5" height="16" fill="currentColor"/></svg></button>
      </div>
    </div>
    <div id="weapons"></div>
    <div class="bottom">
      <div class="winfo"><b id="wName"></b><small id="wDesc"></small></div>
      <label class="sl"><span><i data-i="angle"></i> <b id="vAngle">45°</b></span><input type="range" id="sAngle" min="0" max="90" value="45"></label>
      <label class="sl"><span><i data-i="power"></i> <b id="vPower">70%</b> <em id="inflTag"></em></span><input type="range" id="sPower" min="0" max="100" value="70"></label>
      <label class="chk"><input type="checkbox" id="cPreview" checked><span data-i="preview"></span></label>
      <button id="bFire" data-i="fire"></button>
    </div>
    <div id="debugBar" class="hidden"></div>
  </div>
  <!-- MENU -->
  <div id="menu" class="screen show">
    <div class="poster">
      <div class="rays"></div>
      <h1 id="title"></h1>
      <p class="sub" data-i="subtitle"></p>
      <div class="menuBtns">
        <button id="mPlay" class="big" data-i="play"></button>
        <button id="mLevels" data-i="levels"></button>
        <button id="mHow" data-i="how"></button>
        <button id="mNg" class="hidden"></button>
      </div>
      <div class="langs" id="langs"></div>
      <div class="mfoot"><span><span data-i="totalBest"></span>: <b id="mBest">0</b></span> <button id="mMute" class="small"></button></div>
      <p class="credits" data-i="credits"></p>
    </div>
    <canvas id="menuArt" width="420" height="300"></canvas>
  </div>
  <div id="levelsScr" class="screen"><div class="panel wide"><h2 data-i="levels"></h2><div id="lvGrid"></div><button class="back" data-i="back"></button></div></div>
  <div id="howScr" class="screen"><div class="panel wide"><h2 data-i="how"></h2><ul id="howList"></ul><div id="wpnList"></div><button class="back" data-i="back"></button></div></div>
  <div id="pauseScr" class="screen"><div class="panel"><h2 data-i="paused"></h2><button id="pResume" class="big" data-i="resume"></button><button id="pRestart" data-i="restart"></button><button id="pLevels" data-i="levels"></button><button id="pMenu" data-i="menu"></button></div></div>
  <div id="resultScr" class="screen"><div class="panel"><h2 id="rTitle"></h2><div id="rStars"></div><table id="rTable"></table><p id="rRecord"></p><div class="rbtns"><button id="rNext" class="big" data-i="next"></button><button id="rRetry" data-i="retry"></button><button id="rMenu" data-i="menu"></button></div></div></div>
  <div id="finaleScr" class="screen trans"><div class="panel slim"><h2 id="fTitle"></h2><p id="fScore"></p><div class="rbtns"><button id="fNg" class="big"></button><button id="fMenu" data-i="menu"></button></div></div></div>
</div>
<div id="rotate"><div><svg viewBox="0 0 64 64" width="90"><rect x="18" y="6" width="28" height="48" rx="4" fill="none" stroke="#f2c230" stroke-width="4"/><path d="M52 40a20 20 0 0 1-20 20" stroke="#f2c230" stroke-width="4" fill="none"/><path d="M28 56l4 4 4-6" stroke="#f2c230" stroke-width="4" fill="none"/></svg><p data-i="rotate"></p><button id="rotBtn" data-i="rotateBtn"></button></div></div>
<script src="js/matter.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
